interface=br_lan0    # Listen on bridge LAN interface Default L1
interface=vlan710   # Listen on server VLAN
#interface=vlan714   # Listen on virtual machine VLAN
interface=vlan910   # Listen on workstation VLAN
#interface=vlan922   # Listen on Wi-Fi VLAN
#interface=vlan718   # Listen on container VLAN (DNS only)
#interface=vlan966   # Listen on DMZ VLAN (DNS only)

domain=firelux.local.br
local=/firelux.local.br/
expand-hosts               # Append domain to short hostnames
no-hosts                   # Ignore /etc/hosts, use addn-hosts only
domain-needed              # Never forward bare (non-FQDN) queries upstream
bogus-priv                 # Never forward reverse lookups for private IPs upstream

# Dynamic FQDN set
nftset=/deb.debian.org/4#inet#firelux#deb_ips
nftset=/security.debian.org/4#inet#firelux#deb_ips

# IPv4 DHCP

# br_lan0 - Default (172.16.2.0/24)
dhcp-range=set:BRLAN0,172.16.2.1,172.16.2.50,12h     # Address pool, 12h lease
dhcp-option=tag:BRLAN0,3,172.16.2.254                 # Default gateway
dhcp-option=tag:BRLAN0,6,172.16.2.254                 # DNS server (dnsmasq)
dhcp-option=tag:BRLAN0,42,172.16.2.254                # NTP server

# vlan710 - Server (172.16.10.0/24)
#dhcp-range=set:VLAN710,172.16.10.1,172.16.10.253,12h
#dhcp-option=tag:VLAN710,3,172.16.10.254
#dhcp-option=tag:VLAN710,6,172.16.10.254
#dhcp-option=tag:VLAN710,42,172.16.10.254

# vlan714 - Virtual Machine (172.16.14.0/24)
#dhcp-range=set:VLAN714,172.16.14.1,172.16.14.253,12h
#dhcp-option=tag:VLAN714,3,172.16.14.254
#dhcp-option=tag:VLAN714,6,172.16.14.254
#dhcp-option=tag:VLAN714,42,172.16.14.254

# vlan910 - Workstation (192.168.10.0/24)
dhcp-range=set:VLAN910,192.168.10.1,192.168.10.253,12h
dhcp-option=tag:VLAN910,3,192.168.10.254
dhcp-option=tag:VLAN910,6,192.168.10.254
dhcp-option=tag:VLAN910,42,192.168.10.254

# vlan922 - Wi-Fi (192.168.22.0/24)
#dhcp-range=set:VLAN922,192.168.22.1,192.168.22.253,12h
#dhcp-option=tag:VLAN922,3,192.168.22.254
#dhcp-option=tag:VLAN922,6,192.168.22.254
#dhcp-option=tag:VLAN922,42,192.168.22.254

# IPv6 SLAAC + RDNSS — root prefix fda3:d6a1:a4ec::/48

enable-ra    # Enable IPv6 Router Advertisement daemon

# br_lan0 - Default (fda3:d6a1:a4ec:2::/64)
ra-param=br_lan0,60,900
dhcp-range=set:BRLAN0,fda3:d6a1:a4ec:2::,ra-only,ra-stateless
dhcp-option=tag:BRLAN0,option6:dns-server,[fda3:d6a1:a4ec:2::254]
dhcp-option=tag:BRLAN0,option6:ntp-server,[fda3:d6a1:a4ec:2::254]

# vlan710 - Server (fda3:d6a1:a4ec:710::/64)
#ra-param=vlan710,60,900
#dhcp-range=set:VLAN710,fda3:d6a1:a4ec:710::,ra-only,ra-stateless
#dhcp-option=tag:VLAN710,option6:dns-server,[fda3:d6a1:a4ec:710::254]
#dhcp-option=tag:VLAN710,option6:ntp-server,[fda3:d6a1:a4ec:710::254]

# vlan714 - Virtual Machine (fda3:d6a1:a4ec:714::/64)
#ra-param=vlan714,60,900
#dhcp-range=set:VLAN714,fda3:d6a1:a4ec:714::,ra-only,ra-stateless
#dhcp-option=tag:VLAN714,option6:dns-server,[fda3:d6a1:a4ec:714::254]
#dhcp-option=tag:VLAN714,option6:ntp-server,[fda3:d6a1:a4ec:714::254]

# vlan910 - Workstation (fda3:d6a1:a4ec:910::/64)
#ra-param=vlan910,60,900
#dhcp-range=set:VLAN910,fda3:d6a1:a4ec:910::,ra-only,ra-stateless
#dhcp-option=tag:VLAN910,option6:dns-server,[fda3:d6a1:a4ec:910::254]
#dhcp-option=tag:VLAN910,option6:ntp-server,[fda3:d6a1:a4ec:910::254]

# vlan922 - Wi-Fi (fda3:d6a1:a4ec:922::/64)
#ra-param=vlan922,60,900
#dhcp-range=set:VLAN922,fda3:d6a1:a4ec:922::,ra-only,ra-stateless
#dhcp-option=tag:VLAN922,option6:dns-server,[fda3:d6a1:a4ec:922::254]
#dhcp-option=tag:VLAN922,option6:ntp-server,[fda3:d6a1:a4ec:922::254]

# DNS only VLANs — no DHCP, no RA
# vlan718 - Container (172.16.18.0/24, fda3:d6a1:a4ec:718::/64)
# vlan966 - DMZ       (192.168.66.0/24, fda3:d6a1:a4ec:966::/64)

#server=/domain.local.br/172.30.100.6    # Bypass: forward this domain to specific resolver

dnssec                                                        # Enable DNSSEC validation
cache-size=8192                                               # DNS cache entries
dhcp-sequential-ip                                            # Allocate IPs sequentially
conf-file=/usr/share/dnsmasq-base/trust-anchors.conf          # DNSSEC trust anchors
resolv-file=/etc/dnsmasq.d/config/resolv                      # Upstream DNS servers
addn-hosts=/etc/dnsmasq.d/config/hosts                        # Additional host entries
dhcp-hostsfile=/etc/dnsmasq.d/config/reservations             # Static DHCP reservations

log-queries                                    # Log all DNS queries
log-facility=/var/log/dnsmasq.log              # Log file path